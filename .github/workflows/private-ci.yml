# 🔒 **اختباراتُ المستودع الخاص على عدّاءٍ عامٍّ مجّانيّ — v3** (مراجعة Codex 13-ب · القرارات D11–D20 فوق D1–D10).
#
# مصدرُ هذا الملفّ الحقيقيّ: QuranRafiq/ops/ci/runner-repo/ (يُراجَع هناك ويُدفع إلى mwqwf/mushafak-ci بطلب دمجٍ بصفر موافقات
# يمرّ بـscope-guard — فحصٍ ذاتيٍّ للنطاق لا مراجعةٍ مستقلّة؛ والمراجعةُ المستقلّة Codex قبل كلّ تفعيل).
#
# ثلاثُ وظائف:
#   plan    — بلا سرّ: تفحص الحمولة {sha · kind · runner_sha}؛ وتُفشل فوراً إن runner_sha ≠ github.sha (D1-ب: المنفَّذُ
#             هو الإيداعُ الذي فحص المرسِلُ الخاصُّ بصماتِه بعينه).
#   build   — حدُّ عزلٍ حقيقيٌّ بمستخدمَين على نظام التشغيل (D11): المشرفُ `supervise.sh` (بمستخدم runner · موثوق) يهيّئ مستخدماً
#             بلا sudo `pcibuild` ويحصّن SDK وhostedtoolcache و/home/runner ثمّ **يختبر العزلَ بنفسه**؛ ثمّ يستنسخ (خطوةُ «الاستنساخ»
#             وحدَها تحمل مفتاحَ القراءة وتنتهي بمحوه وقتل ssh-agent والتحقّق) ويُملِّك الشجرةَ لـpcibuild؛ ثمّ يشغّل كلَّ طورٍ بـpcibuild
#             ويسجّل رمزَ خروجه؛ وفي `finalize` وحده يعدّ ويشفّر (age) ويفحص (artifact_check) — **ولا يُرفع Artifact إلا إن
#             أعلن المشرفُ ready=true** (D13). لا شيءَ آخر يغادرها.
#   publish — موثوقة (بيئة publish، عدّاءٌ آخر): أدواتُها من هذا المستودع عند github.sha، تقرأ الناتجَ بياناتٍ لا شيفرة،
#             تفحص سجلّات build العلنيّة بالحارس، ترفع السجلَّ المشفَّر إلى R2 وتتحقّق، ثمّ **حالةٌ واحدةٌ نهائيّة**.
#
# 💰 مستودعٌ عامّ + ubuntu-latest قياسيّ ⇒ بلا فوترة دقائق؛ والـArtifact يومٌ واحدٌ وبضعُ ك.ب.
name: private-ci
run-name: private-ci (${{ github.event_name }})

on:
  repository_dispatch:
    types: [private-ci]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربةٌ على هذا المستودع العامّ نفسِه (لا يُقبل غيرُ true)"
        type: boolean
        required: true
        default: true
      plant_leak:
        description: "ازرع سطراً يشبه الشيفرة في سجلّ build العلنيّ لإثبات أنّ الحالة تسقط وأنّ السجلّ يُحذف"
        type: boolean
        required: false
        default: false
      # الإصلاحُ الخامس (مراجعة Codex 14): تجربتان عامّتان بلا سرٍّ ولا استنساخٍ للخاصّ — لا تجتمعان (plan.py يرفض)
      emu_probe:
        description: "مسبارُ المحاكي الحيّ (النوع dry-run-emu): المحاكي وADB بمستخدم البناء ثمّ إثباتُ العزل والعبورِ الفاشل"
        type: boolean
        required: false
        default: false
      stress_tree:
        description: "شجرةٌ كبيرةٌ في طور البناء (النوع dry-run-stress) لقياس زمن التملّك في finalize وسلوكِ مهلته"
        type: boolean
        required: false
        default: false

# 🛡️ D9: لا صلاحيةَ على مستوى السير؛ كلُّ وظيفةٍ تأخذ ما يلزمها وحدها.
permissions: {}

concurrency:
  group: private-ci-${{ github.event.client_payload.kind || (inputs.emu_probe && 'dry-run-emu') || (inputs.stress_tree && 'dry-run-stress') || 'dry-run' }}-${{ github.event.client_payload.sha || github.sha }}
  # ⛔ لا إلغاء: وظيفةُ publish تجري دائماً، فإلغاءُ تشغيلةٍ قديمة يكتب «تعذّر» قد يسبق حالةَ الجديدة على السياق نفسِه.
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.p.outputs.ok }}
      kind: ${{ steps.p.outputs.kind }}
      sha: ${{ steps.p.outputs.sha }}
      source: ${{ steps.p.outputs.source }}
      plant: ${{ steps.p.outputs.plant }}
      legs: ${{ steps.p.outputs.legs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: jobs/private_ci
      # الحمولةُ عبر env لا داخل الصدفة: لا حقنَ من قيمةٍ علنيّةٍ غيرِ موثوقة.
      - id: p
        env:
          PCI_EVENT: ${{ github.event_name }}
          PCI_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          PCI_DRY_RUN: ${{ inputs.dry_run }}
          PCI_PLANT: ${{ inputs.plant_leak }}
          PCI_EMU_PROBE: ${{ inputs.emu_probe }}
          PCI_STRESS_TREE: ${{ inputs.stress_tree }}
          PCI_HEAD_SHA: ${{ github.sha }}
          PCI_REF: ${{ github.ref }}
        run: python3 jobs/private_ci/plan.py

  build:
    needs: plan
    if: needs.plan.outputs.ok == 'true'
    name: build-${{ matrix.leg.id }}
    runs-on: ubuntu-latest
    # 🔑 البيئةُ build (مقيَّدةٌ بـmain من الإعدادات) لا تحمل إلا مفتاحَ القراءة؛ ويدخل خطوةَ «الاستنساخ» وحدها.
    environment: build
    # أ4: الميزانيةُ (يحسبها المشرفُ من بدئه وتشمل finalize) + هامشٌ لما قبله — فيسبق finalize إيقافَ GitHub دائماً
    timeout-minutes: ${{ matrix.leg.job_timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    env:
      PCI_KIND: ${{ needs.plan.outputs.kind }}
      PCI_SHA: ${{ needs.plan.outputs.sha }}
      PCI_SOURCE: ${{ needs.plan.outputs.source }}
      PCI_LEG: ${{ matrix.leg.id }}
      PCI_LINT: ${{ matrix.leg.lint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: jobs/private_ci
          path: ctl

      # بلا `cache:` — لا ذاكرةَ مؤقّتةٌ لشيءٍ مشتقٍّ من المصدر الخاص. (JDK تحت /opt/hostedtoolcache فيُحصَّن بعدها.)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      # D11: التهيئةُ والتحصينُ واختبارُ العزل (يشمل تثبيتَ age بالبصمة). تفشل ⇒ لا استنساخَ فلا يبلغ المفتاحُ شيئاً.
      # ⛔ هذه آخرُ خطوةٍ تُشغَّل فيها أداةٌ من مساحة العمل؛ كلُّ ما بعدها من $RUNNER_TEMP/pci/ctl (نسخةٌ 700 لا يصلها البناء).
      - name: تهيئة العزل واختباره
        id: prep
        run: bash ctl/jobs/private_ci/supervise.sh prepare

      # 🔑 الخطوةُ الوحيدة التي يدخلها سرّ؛ وفي التجربة لا يُمرَّر أصلاً. تفشل (رمز 9) إن لم يثبت زوالُ المفتاح.
      - name: الاستنساخ
        id: clone
        if: steps.prep.outcome == 'success'
        env:
          PCI_KEY_B64: ${{ needs.plan.outputs.source == 'private' && secrets.PCI_DEPLOY_KEY_B64 || '' }}
        run: bash "$RUNNER_TEMP/pci/ctl/supervise.sh" clone

      # ⛔ من هنا شيفرةٌ غيرُ موثوقة (بمستخدم pcibuild)، ولا سرَّ في أيّ خطوة.
      # الإصلاحُ السادس (Codex 15 · ملاحظة finalize): موعدٌ خارجيٌّ لكلّ خطوةٍ للمشرف. الأطوارُ تنتهي داخلياً عند deadline =
      #     نهايةُ الميزانية − FIN_RESERVE (370 ث منذ ختم الاستثناءات · Codex 6)؛ فمهلةُ الخطوة = الميزانيةُ كلُّها (leg.timeout دقيقة) تزيد على الأطوار بـFIN_RESERVE على الأقلّ.
      - name: البناء والاختبار (المخرجات إلى ملف)
        timeout-minutes: ${{ matrix.leg.timeout }}
        if: steps.clone.outcome == 'success'
        run: bash "$RUNNER_TEMP/pci/ctl/supervise.sh" build

      # أ2: لا إجراءَ محاكٍ بحساب العدّاء — المحاكي وخادمُ ADB يُقلعهما المشرفُ **بمستخدم البناء** (طور emu_up) بمنفذٍ خاصّ،
      #     وصورةُ النظام ثبّتها أمرٌ ثابتٌ (sysimg) قبل أيّ سطرٍ غيرِ موثوق؛ ولا adb بحسابٍ آخر قبل الأطوار ولا بعدها (فحصٌ 18).
      #     وفي التجربة emu_probe (النوع dry-run-emu · شوطُه has_emu) تجري هذه الخطوةُ نفسُها ثمّ طورُ المسبار الموثوق emu_probe.
      - name: المحاكي بمستخدم البناء (المخرجات إلى ملف)
        if: steps.clone.outcome == 'success' && matrix.leg.has_emu
        timeout-minutes: ${{ matrix.leg.timeout }}
        run: bash "$RUNNER_TEMP/pci/ctl/supervise.sh" emu

      # 🧪 التجربةُ الذاتيّة وحدها (plan يفرض false لغير dry-run): سطرٌ مزروعٌ في السجلّ العلنيّ ⇒ يجب أن تسقط الحالة.
      - name: زرع سطر للتجربة
        if: needs.plan.outputs.plant == 'true'
        run: python3 -I -S "$RUNNER_TEMP/pci/ctl/guard.py" --emit-plant

      # D13: يقتل عمليّاتِ pcibuild ← يعدّ ← يشفّر ← يفحص ⇒ ready=true|false (المشرفُ وحده يكتب مجلّدَ الناتج).
      # الإصلاحُ السادس: finalize ≤ FIN_RESERVE = 370 ث ≈ 6.2 د بالإثبات في supervise.sh (كلُّ أمرٍ فيه بمهلة؛ ومنه ختمُ الاستثناءات · Codex 6) ⇒ 8 د = 6.2 + هامشُ ≈ 1.8 د
      #     لبدء الصدفة وpython3؛ ومهلةُ الوظيفة (الميزانية + 6 د · plan.py JOB_MARGIN) تبقى فوقها.
      - name: العدّ والتشفير والفحص
        id: fin
        if: always()
        timeout-minutes: 8
        run: bash "$RUNNER_TEMP/pci/ctl/supervise.sh" finalize

      - name: رفع الناتج
        if: always() && steps.fin.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pci-${{ matrix.leg.id }}
          path: ${{ runner.temp }}/pci/art/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false

  publish:
    needs: [plan, build]
    if: always() && needs.plan.outputs.sha != ''
    runs-on: ubuntu-latest
    # 🔑 البيئةُ publish (مقيَّدةٌ بـmain) تحمل بيانةَ R2 لدلو mushafak-ci-logs ورمزَ الحالة — ولا يجري فيها شيءٌ من الخاصّ.
    environment: publish
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: jobs/private_ci

      - name: تنزيل الناتج
        if: needs.build.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pci-*
          path: ${{ runner.temp }}/in

      - name: الحكم والرفع والحالة الواحدة
        id: pub
        env:
          PCI_KIND: ${{ needs.plan.outputs.kind }}
          PCI_SHA: ${{ needs.plan.outputs.sha }}
          PCI_PLAN_OK: ${{ needs.plan.outputs.ok }}
          PCI_IN: ${{ runner.temp }}/in
          GH_TOKEN: ${{ github.token }}
          # الإصلاحُ السادس (Codex 15 · الملاحظة 3): بيانةُ R2 للمصدر الخاصّ وحده — فالتجربةُ الجافّة بلا سرٍّ ولا أثرٍ خارجيّ (وpublish.py يُهملها فيها أيضاً).
          PCI_R2_JSON: ${{ needs.plan.outputs.source == 'private' && secrets.PRIVATE_CI_R2_JSON || '' }}
          PCI_STATUS_TOKEN: ${{ needs.plan.outputs.source == 'private' && secrets.PCI_STATUS_TOKEN || '' }}
        run: python3 jobs/private_ci/publish.py

      - name: طلب حذف السجل
        if: always() && steps.pub.outputs.suspicious == 'true'
        run: echo "⛔ علامةٌ يقرؤها private-ci-sweeper.yml فيحذف سجلَّ التشغيلة."
